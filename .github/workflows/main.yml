name: EPG Update
on:
  workflow_dispatch:

jobs:
  run-job:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc gzip
          sudo apt clean

      - name: 极速合并去重
        run: |
          # ===================== 配置 =====================
          EPG_SOURCES=(
            "http://epg.51zmt.top:8000/e1.xml"
            "https://raw.githubusercontent.com/kuke31/xmlgz/main/all.xml.gz"
            "https://epg.zsdc.eu.org/t.xml"
            "https://epg.pw/xmltv/epg_CN.xml"
            "https://epg.pw/xmltv/epg_HK.xml"
            "https://epg.pw/xmltv/epg_TW.xml"
          )
          # =================================================

          # 清理
          rm -rf *.xml *.gz *.raw || true

          # 并行下载
          echo "📥 并行下载..."
          idx=0
          for url in "${EPG_SOURCES[@]}"; do
            (
              f="temp_$idx.raw"
              wget -q -T 10 -t 1 -O "$f" "$url"
              if [ -s "$f" ]; then
                if file -b "$f" | grep -q gzip; then
                  gunzip -c "$f" > "temp_$idx.xml"
                else
                  mv "$f" "temp_$idx.xml"
                fi
              fi
              rm -f "$f"
            ) &
            ((idx++))
          done
          wait

          valid=(temp_*.xml)
          [ ${#valid[@]} -eq 0 ] && exit 1

          # 繁转简
          echo "🔄 繁转简..."
          ls temp_*.xml | xargs -P 16 -I {} opencc -i {} -o {} -c t2s.json

          # ========== 核心：awk 极速合并去重 ==========
          echo "🔗 合并去重..."
          grep -a "<?xml" "${valid[0]}" | head -1 > e.xml
          grep -a "<tv " "${valid[0]}" | head -1 >> e.xml

          # 用 awk 一次性处理所有文件，避免循环和多次 grep
          awk '
            /<channel/ {
              match($0, /id="([^"]+)"/, m)
              id = m[1]
              if (id != "" && !seen_channel[id]) {
                print $0
                seen_channel[id] = 1
              }
              next
            }
            /<programme/ {
              match($0, /channel="([^"]+)"/, c)
              match($0, /start="([^"]+)"/, s)
              match($0, /stop="([^"]+)"/, p)
              key = c[1] "|" s[1] "|" p[1]
              if (key != "||" && !seen_program[key]) {
                print $0
                seen_program[key] = 1
              }
              next
            }
            1  # 保留其他行（如display-name、title等子标签）
          ' "${valid[@]}" >> e.xml

          echo "</tv>" >> e.xml

          # 时区
          sed -i 's/+0000/+0800/g' e.xml

          # 压缩
          gzip -9 -c e.xml > e.xml.gz

          # 提交
          git config user.name "bot"
          git config user.email "bot@localhost"
          git add e.xml e.xml.gz

          if ! git diff --cached --quiet; then
            git commit -m "EPG Fast Merge with awk"
            git push --force
          fi

          # 清理
          rm -rf temp_*.xml
