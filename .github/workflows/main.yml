name: EPG Update
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc xmlstarlet
          
      - name: 合并EPG（先转简 → 再去重）
        run: |
          # ===================== 配置区（按优先级从上到下） =====================
          EPG_SOURCES=(
            "http://epg.51zmt.top:8000/e1.xml"
            "http://e.erw.cc/all.xml"
            "https://epg.zsdc.eu.org/t.xml"
            "https://epg.pw/xmltv/epg.xml"
            "https://epg.pw/xmltv/epg_CN.xml"
            "https://epg.pw/xmltv/epg_HK.xml"
            "https://epg.pw/xmltv/epg_TW.xml"
          )
          # ====================================================================

          # 清理旧文件
          rm -rf e.xml e.xml.gz temp_*.xml final_epg.xml

          # 下载所有源
          echo "📥 下载所有EPG源（按优先级）"
          index=0
          for url in "${EPG_SOURCES[@]}"; do
            echo "下载：$url"
            wget -T 20 -t 2 -O "temp_${index}.xml" "$url" || rm -f "temp_${index}.xml"
            index=$((index+1))
          done

          # 检查有效文件
          valid_files=(temp_*.xml)
          if [ ${#valid_files[@]} -eq 0 ] || [ ! -f "${valid_files[0]}" ]; then
            echo "❌ 所有源下载失败"
            exit 1
          fi

          # ===================== 核心步骤：先繁体转简体 =====================
          echo "🔄 开始对所有文件 繁体 → 简体 转换"
          for f in temp_*.xml; do
            if [ -f "$f" ]; then
              opencc -i "$f" -o "$f" -c t2s.json
              echo "✅ 已转换：$f"
            fi
          done

          # ===================== 转换完成后：再合并 + 去重 =====================
          echo "🔗 开始合并（去重规则：优先保留前面的源）"

          # 生成XML头部
          first_file="${valid_files[0]}"
          grep -m1 "^<?xml" "$first_file" > final_epg.xml
          grep -m1 "^<tv " "$first_file" >> final_epg.xml

          # 去重记录（已存在的channel/programme不再添加）
          declare -A seen_channel
          declare -A seen_program

          # 按优先级顺序合并
          for file in temp_*.xml; do
            [ ! -f "$file" ] && continue
            echo "处理：$file"

            # 合并频道（不重复）
            xmlstarlet sel -t -c "//channel" "$file" 2>/dev/null | while read -r chan; do
              cid=$(echo "$chan" | xmlstarlet sel -t -v "string(@id)" - 2>/dev/null)
              if [ -n "$cid" ] && [ -z "${seen_channel[$cid]}" ]; then
                echo "$chan" >> final_epg.xml
                seen_channel[$cid]=1
              fi
            done

            # 合并节目（不重复）
            xmlstarlet sel -t -c "//programme" "$file" 2>/dev/null | while read -r prog; do
              key=$(echo "$prog" | xmlstarlet sel -t -v "concat(@channel,@start,@stop)" - 2>/dev/null)
              if [ -n "$key" ] && [ -z "${seen_program[$key]}" ]; then
                echo "$prog" >> final_epg.xml
                seen_program[$key]=1
              fi
            done
          done

          # 关闭标签
          echo "</tv>" >> final_epg.xml

          # ===================== 时区修正 =====================
          sed -i 's/+0000/+0800/g' final_epg.xml
          mv final_epg.xml e.xml

          # 压缩
          gzip -9 -c e.xml > e.xml.gz
          echo "✅ 全部完成：先转简 → 再去重"

          # ===================== 提交 =====================
          git add -f e.xml e.xml.gz
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "ℹ️ 无更新，跳过推送"
          else
            git commit -m "EPG Update(先繁转简→再去重): $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push --force
            echo "✅ 推送成功"
          fi

          # 清理
          rm -rf temp_*.xml final_epg.xml
