name: EPG Update
on:
  workflow_dispatch

jobs:
  run-job:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc gzip

      - name: 下载+合并（不去重 | 保留全部数据）
        run: |
          # ===================== 【保留你全部源】=====================
          EPG_SOURCES=(
            "http://epg.51zmt.top:8000/e1.xml.gz"
            #"https://raw.githubusercontent.com/kuke31/xmlgz/main/e.xml.gz"
            #"https://raw.githubusercontent.com/kuke31/xmlgz/main/all.xml.gz"
            "https://epg.zsdc.eu.org/t.xml.gz"
            #"https://epg.pw/xmltv/epg_CN.xml"
            #"https://epg.pw/xmltv/epg_HK.xml"
            #"https://epg.pw/xmltv/epg_TW.xml"
          )
          # ==========================================================

          # 清理
          rm -rf *.xml *.gz temp_* || true

          # 下载（支持 .gz）
          echo "📥 下载所有源文件..."
          INDEX=0
          for URL in "${EPG_SOURCES[@]}"; do
            TMP_RAW="temp_${INDEX}.raw"
            wget -q -T 20 -t 2 -O "$TMP_RAW" "$URL" || true

            if [ -s "$TMP_RAW" ]; then
              if file -b "$TMP_RAW" | grep -q gzip; then
                gunzip -c "$TMP_RAW" > "temp_${INDEX}.xml"
              else
                mv "$TMP_RAW" "temp_${INDEX}.xml"
              fi
            fi
            rm -f "$TMP_RAW"
            INDEX=$((INDEX+1))
          done

          # 检查有效文件
          if [ $(ls temp_*.xml 2>/dev/null | wc -l) -eq 0 ]; then
            echo "❌ 所有源下载失败"
            exit 1
          fi

          # 繁转简
          echo "🔄 繁简转换..."
          for f in temp_*.xml; do
            opencc -i "$f" -o "$f" -c t2s.json || true
          done

          # ==================== 【标准合并：不去重 | 保留全部内容】====================
          FIRST_FILE=$(ls temp_*.xml | head -1)
          grep -m1 "^<?xml" "$FIRST_FILE" > e.xml
          grep -m1 "^<tv " "$FIRST_FILE" >> e.xml

          for FILE in temp_*.xml; do
            sed -e '/^<?xml/d' \
                -e '/^<!DOCTYPE/d' \
                -e '/^<tv /d' \
                -e '/^<\/tv>/d' "$FILE" >> e.xml
          done

          echo "</tv>" >> e.xml

          # 时区替换 +0000 → +0800
          sed -i 's/+0000/+0800/g' e.xml

          # 压缩
          gzip -9 -c e.xml > e.xml.gz

          # 清理
          rm -rf temp_*.xml

      # ==================== 提交（你原版格式）====================
      - name: 提交并推送结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add e.xml e.xml.gz
          
          if git diff --cached --quiet; then
            echo "ℹ️ 无变更，跳过提交"
          else
            git commit -m "EPG更新: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ 推送成功"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
