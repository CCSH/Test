name: EPG Update
on:
  workflow_dispatch:

jobs:
  run-job:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc gzip
          sudo apt clean

      - name: 高性能 EPG 合并
        run: |
          # ===================== 配置 =====================
          EPG_SOURCES=(
            "http://epg.51zmt.top:8000/e1.xml"
            "https://raw.githubusercontent.com/kuke31/xmlgz/main/all.xml.gz"
            "https://epg.zsdc.eu.org/t.xml"
            "https://epg.pw/xmltv/epg_CN.xml"
            "https://epg.pw/xmltv/epg_HK.xml"
            "https://epg.pw/xmltv/epg_TW.xml"
          )
          # =================================================

          # ========== 清理缓存 ==========
          echo "🧹 清理缓存..."
          rm -rf *.xml *.gz *.raw || true

          # ========== 并行下载 ==========
          echo "📥 并行下载中..."
          index=0
          for url in "${EPG_SOURCES[@]}"; do
            (
              i="$index"
              tmp_raw="temp_${i}.raw"
              wget -q -T 15 -t 1 -O "$tmp_raw" "$url" || true
              
              if [ -s "$tmp_raw" ]; then
                if file -b "$tmp_raw" | grep -q gzip; then
                  gunzip -c "$tmp_raw" > "temp_${i}.xml"
                else
                  mv "$tmp_raw" "temp_${i}.xml"
                fi
              fi
              rm -f "$tmp_raw"
            ) &
            index=$((index+1))
          done
          wait

          # ========== 检查有效文件 ==========
          valid_files=(temp_*.xml)
          if [ ${#valid_files[@]} -eq 0 ]; then
            echo "❌ 下载失败"
            exit 1
          fi

          # ========== 批量繁转简 ==========
          echo "🔄 批量繁转简..."
          ls temp_*.xml 2>/dev/null | xargs -P 10 -I {} opencc -i {} -o {} -c t2s.json

          # ========== 合并去重 ==========
          echo "🔗 合并去重（高性能模式）"
          first="${valid_files[0]}"
          grep -a "<?xml" "$first" | head -1 > final_epg.xml
          grep -a "<tv " "$first" | head -1 >> final_epg.xml

          declare -A seen_channel
          declare -A seen_program

          for file in temp_*.xml; do
            [ ! -s "$file" ] && continue

            # 提取 channel
            grep -a "<channel" "$file" | while IFS= read -r line; do
              cid=$(grep -oP 'id="\K[^"]+' <<< "$line" | head -1)
              [ -n "$cid" ] && [ -z "${seen_channel[$cid]}" ] && {
                echo "$line"
                seen_channel[$cid]=1
              }
            done >> final_epg.xml

            # 提取 programme
            grep -a "<programme" "$file" | while IFS= read -r line; do
              chan=$(grep -oP 'channel="\K[^"]+' <<< "$line")
              start=$(grep -oP 'start="\K[^"]+' <<< "$line")
              stop=$(grep -oP 'stop="\K[^"]+' <<< "$line")
              key="$chan|$start|$stop"
              [ -n "$key" ] && [ -z "${seen_program[$key]}" ] && {
                echo "$line"
                seen_program[$key]=1
              }
            done >> final_epg.xml
          done

          echo "</tv>" >> final_epg.xml

          # ========== 时区修正 ==========
          sed -i 's/+0000/+0800/g' final_epg.xml
          mv final_epg.xml e.xml

          # ========== 压缩 ==========
          gzip -9 -c e.xml > e.xml.gz

          # ========== 提交 ==========
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git add e.xml e.xml.gz

          if git diff --cached --quiet; then
            echo "ℹ️ 无更新"
          else
            git commit -m "EPG 极速优化版 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push --force
            echo "✅ 推送完成"
          fi
