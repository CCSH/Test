name: EPG Update
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc xmlstarlet gzip
          
      - name: 合并EPG（先转简 → 再去重）
        run: |
          # ===================== 配置区（按优先级从上到下） =====================
          EPG_SOURCES=(
            "http://epg.51zmt.top:8000/e1.xml"
            "https://raw.githubusercontent.com/kuke31/xmlgz/main/all.xml.gz"
            "https://epg.zsdc.eu.org/t.xml"
            "https://epg.pw/xmltv/epg_CN.xml"
            "https://epg.pw/xmltv/epg_HK.xml"
            "https://epg.pw/xmltv/epg_TW.xml"
          )
          # ====================================================================

          # 清理旧文件
          rm -rf e.xml e.xml.gz temp_*.xml final_epg.xml

          # 下载所有源（自动处理 .gz）
          echo "📥 下载所有EPG源（支持 .xml / .xml.gz）"
          index=0
          for url in "${EPG_SOURCES[@]}"; do
            echo "下载：$url"
            tmp_raw="temp_${index}.raw"
            wget -T 20 -t 2 -O "$tmp_raw" "$url" || { rm -f "$tmp_raw"; index=$((index+1)); continue; }

            # 判断是否为 gz 压缩包，自动解压
            if file "$tmp_raw" | grep -q 'gzip compressed'; then
              gunzip -c "$tmp_raw" > "temp_${index}.xml"
            else
              mv "$tmp_raw" "temp_${index}.xml"
            fi
            rm -f "$tmp_raw"
            index=$((index+1))
          done

          # 检查有效文件
          valid_files=(temp_*.xml)
          if [ ${#valid_files[@]} -eq 0 ] || [ ! -f "${valid_files[0]}" ]; then
            echo "❌ 所有源下载失败"
            exit 1
          fi

          # ===================== 繁体→简体 转换 =====================
          echo "🔄 开始对所有文件 繁体 → 简体 转换"
          for f in temp_*.xml; do
            if [ -f "$f" ]; then
              opencc -i "$f" -o "$f" -c t2s.json
              echo "✅ 已转换：$f"
            fi
          done

          # ===================== 合并 + 去重 =====================
          echo "🔗 开始合并（去重规则：优先保留前面的源）"

          first_file="${valid_files[0]}"
          grep -m1 "^<?xml" "$first_file" > final_epg.xml
          grep -m1 "^<tv " "$first_file" >> final_epg.xml

          declare -A seen_channel
          declare -A seen_program

          for file in temp_*.xml; do
            [ ! -f "$file" ] && continue
            echo "处理：$file"

            # 安全读取 channel
            while IFS= read -r chan || [ -n "$chan" ]; do
              [ -z "$chan" ] && continue
              cid=$(echo "$chan" | xmlstarlet sel -t -v "string(@id)" - 2>/dev/null)
              if [ -n "$cid" ] && [ -z "${seen_channel[$cid]}" ]; then
                echo "$chan" >> final_epg.xml
                seen_channel[$cid]=1
              fi
            done < <(xmlstarlet sel -t -c "//channel" "$file" 2>/dev/null)

            # 安全读取 programme
            while IFS= read -r prog || [ -n "$prog" ]; do
              [ -z "$prog" ] && continue
              key=$(echo "$prog" | xmlstarlet sel -t -v "concat(@channel,@start,@stop)" - 2>/dev/null)
              if [ -n "$key" ] && [ -z "${seen_program[$key]}" ]; then
                echo "$prog" >> final_epg.xml
                seen_program[$key]=1
              fi
            done < <(xmlstarlet sel -t -c "//programme" "$file" 2>/dev/null)
          done

          echo "</tv>" >> final_epg.xml

          # 时区修正
          sed -i 's/+0000/+0800/g' final_epg.xml
          mv final_epg.xml e.xml

          # 压缩输出
          gzip -9 -c e.xml > e.xml.gz
          echo "✅ 全部完成"

          # 提交
          git add -f e.xml e.xml.gz
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "ℹ️ 无更新，跳过推送"
          else
            git commit -m "EPG Update(支持 .xml+.gz 先转简→去重): $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push --force
            echo "✅ 推送成功"
          fi

          # 清理
          rm -rf temp_*.xml final_epg.xml
